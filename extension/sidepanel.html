<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrowseLoom Panel</title>
  <link rel="stylesheet" href="sidepanel.css">
  <script src="theme-init.js"></script>
</head>
<body>
  <header class="panel-header">
    <div>
      <div class="panel-brand">BrowseLoom</div>
      <h1>Tabs</h1>
    </div>
    <button class="icon-btn" id="refreshBtn" title="Refresh" aria-label="Refresh side panel">↻</button>
  </header>

  <main>
    <section class="panel-view active" id="tabsView">
      <div class="search-row">
        <input id="panelSearch" type="search" placeholder="Search tabs, Read later, and collections" autocomplete="off" aria-label="Search tabs, Read later, and collections">
        <button id="saveSessionBtn">Save this window</button>
      </div>
      <div class="quick-actions">
        <button id="saveAllWindowsBtn">Save all windows</button>
        <button id="dedupeBtn">Close duplicates</button>
        <button id="newTabBtn">Open home</button>
      </div>
      <div class="result-list" id="resultList"></div>
      <section class="panel-section">
        <div class="panel-section-title" id="recentTitle">Recently closed</div>
        <div class="recent-list" id="recentList"></div>
      </section>
    </section>
  </main>

  <div class="panel-toast" id="panelToast"></div>

  <script src="services/url-service.js"></script>
  <script src="services/storage-service.js"></script>
  <script src="services/tabs-service.js"></script>
  <script src="services/search-service.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
